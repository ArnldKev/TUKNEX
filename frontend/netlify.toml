[build]
  command = "npm run build:release"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/api/*"
  to = "https://tuknex-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Static document protection. CSP starts in report-only to evaluate Next inline
# hydration, local WebGL models, blob audio/PDF previews and the two project frames.
[[headers]]
  for = "/*"
  [headers.values]
    "Content-Security-Policy-Report-Only" = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://tuknex-backend.onrender.com; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob: https://el-gringo-jym.netlify.app https://corry-sport.netlify.app; form-action 'self'"
    "X-Frame-Options" = "SAMEORIGIN"
    "X-Content-Type-Options" = "nosniff"
    "Referrer-Policy" = "strict-origin-when-cross-origin"
    "Permissions-Policy" = "camera=(), geolocation=(), microphone=(self), payment=()"

# Next static assets are content-hashed or scoped to a unique build ID.
# Do not extend this rule to HTML, unversioned images or private /api responses.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    "Cache-Control" = "public,max-age=31536000,immutable"
